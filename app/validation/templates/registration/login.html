{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="error" data-testid="login-error">Your username and password didn't match. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" data-testid="login-submit">Log in</button>
  </form>
</div>
{% endblock %}
