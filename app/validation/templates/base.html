<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Validator{% endblock %} · Data Validator</title>
  <style>
    :root { --fg: #1f2933; --muted: #616e7c; --line: #d9e2ec; --bg: #f5f7fa; --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { display: flex; align-items: center; gap: 1.5rem; padding: .75rem 1.5rem; background: #fff; border-bottom: 1px solid var(--line); }
    header .brand { font-weight: 700; margin-right: auto; }
    header a { color: var(--fg); text-decoration: none; }
    header form { margin: 0; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: .85rem; text-transform: uppercase; }
    button, .button { display: inline-block; padding: .5rem 1rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; text-decoration: none; }
    button.link { background: none; color: var(--fg); padding: 0; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input[type=text], input[type=password] { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .field { margin-bottom: 1rem; }
    .messages { list-style: none; padding: 0; }
    .messages li, .error { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .messages li { background: #dcfce7; color: var(--ok); }
    .error { background: #fee2e2; color: var(--bad); }
    .status { font-weight: 700; text-transform: capitalize; }
    .status.passed { color: var(--ok); }
    .status.failed { color: var(--bad); }
    .stats { display: flex; gap: 1rem; }
    .stats div { flex: 1; text-align: center; }
    .stats strong { display: block; font-size: 1.75rem; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <span class="brand">Data Validator</span>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}" data-testid="nav-dashboard">Dashboard</a>
      <a href="{% url 'upload' %}" data-testid="nav-upload">Upload</a>
      <span class="muted" data-testid="current-user">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="link" data-testid="logout-button">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li data-testid="flash-message">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
