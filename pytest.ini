[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/test-results
markers =
    ui: browser tests driven through the page objects (auto-applied to tests/ui)
    api: HTTP API tests via Playwright's request context (auto-applied to tests/api)
    smoke: fast critical-path checks
